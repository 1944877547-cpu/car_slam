# 原生ICP激光里程计；TF统一交给激光+IMU EKF，不使用轮式运动初值。
/**:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: false
    guess_frame_id: ""
    wait_imu_to_init: false
    wait_for_transform: 0.5
    expected_update_rate: 10.0
    # N10驱动使用Reliable发布；ICP输出也保持Reliable供EKF读取。
    qos: 1
    scan_range_min: 0.2
    scan_range_max: 8.0
    # N10没有逐束时间信息，不开启依赖逐束采样时间的去畸变。
    deskewing: false
    Reg/Strategy: "1"
    Reg/Force3DoF: "true"
