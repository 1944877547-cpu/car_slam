# 雷达+IMU方案：读取激光及融合里程计，使用ICP几何匹配与二维激光栅格。
/**:
  ros__parameters:
    frame_id: base_link
    map_frame_id: map
    # 使用/odom消息及其协方差，来源为激光ICP+IMU EKF。
    odom_frame_id: ""
    subscribe_odom: true
    publish_tf: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_rgbd: false
    subscribe_stereo: false
    subscribe_scan: true
    subscribe_odom_info: false
    approx_sync: true
    approx_sync_max_interval: 0.06
    topic_queue_size: 10
    sync_queue_size: 20
    qos_scan: 2
    qos_odom: 1
    wait_for_transform: 0.5
    # 核心参数保持字符串类型；1=ICP，平面车只估计x/y/yaw。
    Reg/Strategy: "1"
    Reg/Force3DoF: "true"
    RGBD/NeighborLinkRefining: "true"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/ProximityGlobalScanMap: "true"
    RGBD/OptimizeFromGraphEnd: "false"
    # 二维模式不使用IMU姿态重力约束，IMU角速度已经在EKF内融合。
    Optimizer/GravitySigma: "0"
    Rtabmap/DetectionRate: "1.0"
    Grid/Sensor: "0"
    Grid/3D: "false"
    Grid/CellSize: "0.05"
    Grid/RangeMin: "0.2"
    Grid/RangeMax: "8.0"
