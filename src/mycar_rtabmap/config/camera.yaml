# 项目相机配置；相机SDK内部标定负责彩深对齐，URDF负责相机到车体的安装外参。
/**:
  ros__parameters:
    camera_name: camera
    # SV1301S_U3 / Astra Stereo S U3，沿用官方 astra_stereo_u3 的采集规格。
    enable_color: true
    # 这是请求的采集规格，实际可用组合需由设备profile和运行时日志确认。
    color_width: 640
    color_height: 480
    color_fps: 30
    color_format: MJPG
    enable_depth: true
    depth_width: 640
    depth_height: 400
    depth_fps: 30
    depth_format: Y11
    # 将深度投影到彩色相机，RGB-D 使用彩色内参和光学坐标系。
    depth_registration: true
    align_mode: SW
    enable_depth_scale: true
    # 本机SV1301S_U3不支持SDK硬件帧同步，RGB-D由rgbd_sync按时间戳配对。
    enable_frame_sync: false
    # 使用驱动提供的主机时间域，不能将设备开机毫秒当作ROS绝对时间。
    time_domain: system
    enable_ir: false
    enable_left_ir: false
    enable_right_ir: false
    enable_accel: false
    enable_gyro: false
    # 驱动直接输出图像和内参；三维点云由RTAB-Map从深度图投影生成。
    enable_point_cloud: false
    enable_colored_point_cloud: false
    enable_d2c_viewer: false
    # 相机内部外参由SDK发布；base_link -> camera_link由URDF发布。
    publish_tf: true
    tf_publish_rate: 0.0
