controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    # 与实车及 URDF 一致的轮距、轮半径。
    wheel_separation: 0.125
    wheel_radius: 0.0325
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    open_loop: false  # 根据STM32回传的真实累计编码器位置计算/odom_raw。
    position_feedback: true
    enable_odom_tf: false
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    pose_covariance_diagonal: [1.0, 1.0, 1000000.0, 1000000.0, 1000000.0, 1.0]
    twist_covariance_diagonal: [0.04, 0.001, 1000000.0, 1000000.0, 1000000.0, 1.0]
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.20  # 底盘最终指令限速
    linear.x.min_velocity: -0.20
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.20
    angular.z.min_velocity: -1.20
